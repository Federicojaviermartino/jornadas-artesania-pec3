<!-- Componente: ficha de ponente. Container query: al superar 520px de ancho
     propio pasa a maquetacion horizontal (foto a la izquierda).
     Locals: rootClass, badgeClass, nameClass, discipline, img, alt, badge,
             role, name, bio, topicIcon, topic, links[{p,i,label}] -->
<article
  class="speaker card group @container flex min-w-0 flex-col transition duration-300 hover:-translate-y-1 hover:shadow-lg @[520px]:flex-row {{ rootClass }}"
  data-discipline="{{ discipline }}"
>
  <div
    class="relative aspect-[4/3] overflow-hidden bg-cream @[520px]:aspect-auto @[520px]:h-auto @[520px]:flex-[0_0_220px]"
  >
    <span class="pill absolute left-4 top-4 text-white {{ badgeClass }}">{{ badge }}</span>
    <img
      src="{{ img }}"
      alt="{{ alt }}"
      loading="lazy"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
    />
  </div>
  <div class="flex flex-1 flex-col gap-2 p-6">
    <p class="text-sm font-semibold uppercase tracking-wide text-clay-dark">{{ role }}</p>
    <h3 class="text-ink {{ nameClass }}">{{ name }}</h3>
    <p class="text-muted">{{ bio }}</p>
    <div class="mt-auto flex items-center justify-between gap-4 border-t border-line pt-4">
      <span class="flex items-center gap-2 text-sm text-subtle">
        <i class="fa-solid {{ topicIcon }} text-clay" aria-hidden="true"></i>
        {{ topic }}
      </span>
      <ul class="m-0 flex list-none gap-2 p-0">
        <each loop="link in links">
          <li>
            <a
              href="#"
              class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-cream text-clay-dark transition hover:bg-clay hover:text-white"
              aria-label="{{ link.label }}"
            >
              <i class="{{ link.p }} {{ link.i }}" aria-hidden="true"></i>
            </a>
          </li>
        </each>
      </ul>
    </div>
  </div>
</article>
