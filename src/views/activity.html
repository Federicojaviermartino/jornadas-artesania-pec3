<!-- Componente: actividad del programa (pagina de ponentes).
     Locals: time, title, description, location -->
<article class="flex flex-1 basis-[240px] flex-col gap-2 rounded-md border border-line bg-white p-6">
  <span class="text-sm font-semibold text-clay-dark">{{ time }}</span>
  <h4 class="text-lg text-ink">{{ title }}</h4>
  <p class="text-muted">{{ description }}</p>
  <p class="mt-auto flex items-center gap-2 text-sm text-subtle">
    <i class="fa-solid fa-map-marker-alt text-clay" aria-hidden="true"></i>
    {{ location }}
  </p>
</article>
