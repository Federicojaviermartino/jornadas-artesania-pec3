<!-- Componente: tarjeta de informacion practica (portada).
     Locals: icon (clase FontAwesome), title, text -->
<article class="flex items-start gap-4 rounded-lg bg-white p-6 shadow-sm">
  <i
    class="fa-solid {{ icon }} h-12 w-12 shrink-0 rounded-full bg-cream text-center text-2xl leading-[3rem] text-clay-dark"
    aria-hidden="true"
  ></i>
  <div>
    <h3 class="mb-2 text-lg text-ink">{{ title }}</h3>
    <p class="text-muted">{{ text }}</p>
  </div>
</article>
